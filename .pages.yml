media:
  - name: activities
    label: HTML teaching activities
    input: resources
    output: resources
    extensions: [html]
    rename: safe

settings:
  content:
    merge: true

content:
  - name: resources
    label: Resource catalogue
    type: file
    path: resources.json
    format: json
    list: true
    fields:
      - name: title
        label: Resource title
        type: string
        required: true

      - name: spotlight
        label: Feature in Spotlight (select only one resource)
        type: boolean

      - name: description
        label: Description
        type: text
        required: true

      - name: domain
        label: Primary learning domain
        type: select
        required: true
        options:
          values:
            - Communication and Language
            - Numeracy
            - Daily Living Skills
            - Social-Emotional Learning
            - Vocational Education
            - Arts
            - Physical Education
            - Digital Literacy
            - Teaching Supports

      - name: context
        label: Teaching context
        type: select
        options:
          values: [Living, Learning, Working, Online Safety]

      - name: previewUrl
        label: Try It path
        type: string
        required: true
        pattern: '^resources/[a-z0-9-]+\.html$'

      - name: downloadUrl
        label: Download path
        type: string
        pattern: '^resources/[a-z0-9-]+\.(html|zip)$'

      - name: id
        label: Resource ID
        type: string
        required: true
        pattern: '^[a-z0-9-]+$'

      - name: additionalDomains
        label: Additional focus areas
        type: select
        hidden: true
        options:
          multiple: true
          values: [Digital Literacy, Healthy and Safe Relationships]

      - name: hostingType
        label: Hosting type
        type: select
        hidden: true
        options:
          values: [local, external]

      - { name: school, type: string, hidden: true }
      - { name: creator, type: string, hidden: true }
      - { name: learningObjective, type: text, hidden: true }
      - { name: suggestedUse, type: text, hidden: true }
      - { name: skillArea, type: string, hidden: true }
      - { name: tags, type: string, list: true, hidden: true }
      - { name: adaptations, type: text, list: true, hidden: true }
      - { name: instructionalApproach, type: text, hidden: true }
      - { name: assessmentCheck, type: text, hidden: true }
      - { name: transferTask, type: text, hidden: true }
      - { name: curriculumContext, type: text, hidden: true }
      - { name: reviewStatus, type: string, hidden: true }
      - { name: license, type: text, hidden: true }
      - { name: resourceType, type: string, hidden: true }
      - { name: reusePermission, type: text, hidden: true }
